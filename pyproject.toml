[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-network-analysis"
version = "0.1.0"
description = "Weighted bipartite network analysis of MovieLens 1M"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
]

[tool.setuptools.packages.find]
include = ["movielens_network*"]

